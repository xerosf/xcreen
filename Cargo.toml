[package]
name = "XCreen"
version = "0.4.1"
description = "External Monitor Brightness Control"
authors = ["Sansith Fernando"]
edition = "2024"
rust-version = "1.95"
readme = "README.md"
repository = "https://github.com/xerosf/XCreen"
license-file = "LICENSE"
build = "build.rs"

# Performance optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[[bin]]
name = "XCreen"
path = "src/main.rs"

[dependencies]
# System tray
tray-icon = { version = "0.26.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Config persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = { version = "0.4", features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std", "log-always"] }

# Windows APIs for DDC/CI and light sensor
windows = { version = "0.62.2", features = [
    "Devices_Sensors",
    "Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell"
] }

windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "79d8db43bbd38167941416cea2004dd3067e785a" }

# Autostart (Windows registry)
winreg = "0.56.0"

# Config file watching
notify = { version = "8.2.1", default-features = false }

[build-dependencies]
winres = "0.1"
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "79d8db43bbd38167941416cea2004dd3067e785a" }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
wildcard_imports = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
needless_borrow = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
doc_markdown = "warn"
undocumented_unsafe_blocks = "warn"
